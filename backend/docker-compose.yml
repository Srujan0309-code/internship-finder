version: '3.9'

services:
  app:
    build:
      context: .
      target: runner
    container_name: internship_finder_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/internship_finder
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internship_net
    volumes:
      - ./logs:/app/logs

  mongo:
    image: mongo:7-jammy
    container_name: internship_finder_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internship_net

  mongo-express:
    image: mongo-express:latest
    container_name: internship_finder_mongo_express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongo
    networks:
      - internship_net

volumes:
  mongo_data:

networks:
  internship_net:
    driver: bridge
